<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THANUJ</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:white;
}

header{
  padding:20px;
  background:#151d38;
  text-align:center;
}

main{
  padding:20px;
  max-width:600px;
  margin:auto;
}

.card{
  background:#151d38;
  padding:20px;
  border-radius:18px;
  margin-bottom:15px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#5865f2;
  color:white;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  margin-top:10px;
  box-sizing:border-box;
  border-radius:10px;
  border:1px solid #44527b;
  background:#0b1020;
  color:white;
}

img{
  width:100%;
  margin-top:15px;
  border-radius:12px;
}

#app{
  display:none;
}

#preview{
  display:none;
}

nav{
  display:flex;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#151d38;
}

nav button{
  margin:0;
  border-radius:0;
  background:#151d38;
}
</style>
</head>

<body>

<header>
<h2>THANUJ Analyzing</h2>
<p>Educational Image Analysis</p>
</header>

<!-- LOGIN -->

<div id="login">

<main>

<div class="card">

<h2>Login</h2>

<p>Enter your phone number</p>

<input
id="phone"
type="tel"
maxlength="10"
placeholder="Phone number">

<button onclick="sendOTP()">
Send OTP
</button>

<div id="otpBox" style="display:none">

<input
id="otp"
type="tel"
maxlength="6"
placeholder="Enter OTP">

<button onclick="login()">
Verify OTP
</button>

</div>

<p id="message"></p>

</div>

<div class="card">
Demo OTP: <b>123456</b>
</div>

</main>

</div>


<!-- APP -->

<div id="app">

<main>

<section id="home">

<div class="card">

<h2>Image Upload</h2>

<p>
Choose an image from your phone.
</p>

<input
id="imageInput"
type="file"
accept="image/*">

<img id="preview">

<button onclick="analyze()">
Analyze Image
</button>

<p id="result"></p>

</div>

</section>


<section id="history"
style="display:none">

<div class="card">

<h2>History</h2>

<div id="historyList">
No history yet.
</div>

</div>

</section>


<section id="profile"
style="display:none">

<div class="card">

<h2>Profile</h2>

<p>Name: THANUJ</p>

<p id="profilePhone"></p>

</div>

</section>


<section id="settings"
style="display:none">

<div class="card">

<h2>Settings</h2>

<p>THANUJ Educational Image Analysis</p>

<button onclick="logout()">
Logout
</button>

</div>

</section>

</main>


<nav>

<button onclick="page('home')">
Home
</button>

<button onclick="page('history')">
History
</button>

<button onclick="page('profile')">
Profile
</button>

<button onclick="page('settings')">
Settings
</button>

</nav>

</div>


<script>

function sendOTP(){

var phone=document.getElementById("phone").value;

if(phone.length!=10){

document.getElementById("message").innerText=
"Enter 10 digit phone number";

return;

}

document.getElementById("otpBox").style.display="block";

document.getElementById("message").innerText=
"OTP generated. Use 123456";

}

function login(){

var otp=document.getElementById("otp").value;

if(otp!="123456"){

document.getElementById("message").innerText=
"Wrong OTP";

return;

}

localStorage.setItem("login","yes");

document.getElementById("login").style.display="none";

document.getElementById("app").style.display="block";

document.getElementById("profilePhone").innerText=
"Phone: "+document.getElementById("phone").value;

}

function logout(){

localStorage.removeItem("login");

location.reload();

}

function page(name){

document.getElementById("home").style.display="none";
document.getElementById("history").style.display="none";
document.getElementById("profile").style.display="none";
document.getElementById("settings").style.display="none";

document.getElementById(name).style.display="block";

}

document.getElementById("imageInput").onchange=function(){

var file=this.files[0];

if(!file)return;

var reader=new FileReader();

reader.onload=function(e){

document.getElementById("preview").src=e.target.result;

document.getElementById("preview").style.display="block";

};

reader.readAsDataURL(file);

};

function analyze(){

var image=document.getElementById("preview");

if(!image.src){

alert("Select an image first");

return;

}

document.getElementById("result").innerText=
"Image loaded successfully. Educational analysis ready.";

}

if(localStorage.getItem("login")=="yes"){

document.getElementById("login").style.display="none";

document.getElementById("app").style.display="block";

}

</script>

</body>
</html>
